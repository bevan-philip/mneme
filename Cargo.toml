[package]
name = "anki-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anki = { git = "https://github.com/ankitects/anki.git", rev = "4acb5329e6ad7944dad39cfcdae1519732654cf1", version = "0.0.0", features = ["rustls"] }
anki_proto = { git = "https://github.com/ankitects/anki.git", rev = "4acb5329e6ad7944dad39cfcdae1519732654cf1", version = "0.0.0" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
reqwest = { version = "0.12.28", default-features = false }
rusqlite = "0.36.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-pickle = "1.2.0"
tokio = { version = "1.53.1", features = ["io-util", "rt"] }

[dev-dependencies]
tempfile = "3.27.0"
