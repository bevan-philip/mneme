[package]
name = "mneme-anki"
version = "0.1.0"
edition = "2024"

[dependencies]
anki = { git = "https://github.com/ankitects/anki.git", rev = "b5df43b6a05d1270f33f6c2457eb937d8be9eda4", version = "0.0.0", features = ["rustls"] }
anki_proto = { git = "https://github.com/ankitects/anki.git", rev = "b5df43b6a05d1270f33f6c2457eb937d8be9eda4", version = "0.0.0" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
encoding_rs_io = "0.1.8"
reqwest = { version = "0.12.28", default-features = false }
rusqlite = "0.36.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-pickle = "1.2.0"
tokio = { version = "1.53.1", features = ["io-util", "rt"] }
unicode-normalization = "0.1.25"

[dev-dependencies]
tempfile = "3.27.0"
